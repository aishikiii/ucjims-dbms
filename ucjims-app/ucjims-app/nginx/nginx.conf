events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format without exposing sensitive URL queries or passwords
    log_format masked_combined '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log masked_combined;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Hardened Payload & Buffer Limits
    client_max_body_size 2M;
    client_body_buffer_size 128k;

    # Rate Limiting Zones (Defense against brute-force and DoS)
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_brute_force:10m rate=5r/s;

    # Upstream Services
    upstream backend_service {
        server backend:4000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;

        # Frontend Static Asset Delivery with SPA Routing
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Dedicated Brute-Force Rate Limiting on Login Endpoint
        location = /api/auth/login {
            limit_req zone=login_brute_force burst=10 nodelay;

            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API Reverse Proxy
        location /api/ {
            limit_req zone=api_rate_limit burst=50 nodelay;

            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Block direct access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
